<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="solid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#333333"/>
    </marker>
  </defs>

  <rect width="800" height="440" fill="#ffffff"/>

  <!-- Client -->
  <rect x="20" y="34" width="190" height="66" rx="6" fill="#fde8c8" stroke="#333333" stroke-width="1.5"/>
  <text x="115" y="60" text-anchor="middle" font-size="16" font-weight="700" fill="#222222">Application</text>
  <text x="115" y="82" text-anchor="middle" font-size="13" fill="#444444">(client)</text>
  <line x1="210" y1="67" x2="276" y2="67" stroke="#333333" stroke-width="1.5" marker-end="url(#solid)"/>
  <text x="243" y="58" text-anchor="middle" font-size="12" fill="#444444">uses</text>

  <!-- Abstract factory -->
  <rect x="280" y="20" width="250" height="94" rx="6" fill="#d9ecd0" stroke="#333333" stroke-width="1.5"/>
  <text x="405" y="40" text-anchor="middle" font-size="12" font-style="italic" fill="#444444">«interface»</text>
  <text x="405" y="60" text-anchor="middle" font-size="16" font-weight="700" fill="#222222">GUIFactory</text>
  <line x1="280" y1="68" x2="530" y2="68" stroke="#333333" stroke-width="1"/>
  <text x="292" y="86" font-size="13" fill="#333333">+createButton(): Button</text>
  <text x="292" y="104" font-size="13" fill="#333333">+createCheckbox(): Checkbox</text>

  <!-- Concrete factories -->
  <rect x="110" y="170" width="200" height="48" rx="6" fill="#d9ecd0" stroke="#333333" stroke-width="1.5"/>
  <text x="210" y="200" text-anchor="middle" font-size="15" font-weight="700" fill="#222222">WindowsFactory</text>
  <rect x="490" y="170" width="200" height="48" rx="6" fill="#d9ecd0" stroke="#333333" stroke-width="1.5"/>
  <text x="590" y="200" text-anchor="middle" font-size="15" font-weight="700" fill="#222222">MacFactory</text>

  <!-- implements arrows -->
  <path d="M210,170 L210,142 L380,142 L380,128" fill="none" stroke="#333333" stroke-width="1.5" stroke-dasharray="6,4"/>
  <polygon points="380,115 373,128 387,128" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <path d="M590,170 L590,142 L430,142 L430,128" fill="none" stroke="#333333" stroke-width="1.5" stroke-dasharray="6,4"/>
  <polygon points="430,115 423,128 437,128" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="405" y="160" text-anchor="middle" font-size="12" fill="#444444">implements</text>

  <!-- creates arrows -->
  <line x1="210" y1="218" x2="210" y2="268" stroke="#333333" stroke-width="1.5" marker-end="url(#solid)"/>
  <text x="222" y="248" font-size="12" fill="#444444">creates</text>
  <line x1="590" y1="218" x2="590" y2="268" stroke="#333333" stroke-width="1.5" marker-end="url(#solid)"/>
  <text x="602" y="248" font-size="12" fill="#444444">creates</text>

  <!-- Windows family -->
  <rect x="40" y="272" width="340" height="146" rx="10" fill="#e3edfb" stroke="#4a6fa5" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="210" y="296" text-anchor="middle" font-size="14" font-weight="700" fill="#2f4f7f">Windows family</text>
  <rect x="58" y="312" width="146" height="42" rx="5" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
  <text x="131" y="338" text-anchor="middle" font-size="14" fill="#222222">WindowsButton</text>
  <rect x="216" y="312" width="146" height="42" rx="5" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
  <text x="289" y="338" text-anchor="middle" font-size="14" fill="#222222">WindowsCheckbox</text>
  <text x="210" y="392" text-anchor="middle" font-size="12" fill="#444444">implement Button / Checkbox</text>

  <!-- Mac family -->
  <rect x="420" y="272" width="340" height="146" rx="10" fill="#efe9fb" stroke="#6b4fa5" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="590" y="296" text-anchor="middle" font-size="14" font-weight="700" fill="#4f2f7f">macOS family</text>
  <rect x="438" y="312" width="146" height="42" rx="5" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
  <text x="511" y="338" text-anchor="middle" font-size="14" fill="#222222">MacButton</text>
  <rect x="596" y="312" width="146" height="42" rx="5" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
  <text x="669" y="338" text-anchor="middle" font-size="14" fill="#222222">MacCheckbox</text>
  <text x="590" y="392" text-anchor="middle" font-size="12" fill="#444444">implement Button / Checkbox</text>
</svg>
