<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="solid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#333333"/>
    </marker>
  </defs>

  <rect width="800" height="420" fill="#ffffff"/>

  <!-- Client -->
  <rect x="20" y="30" width="190" height="66" rx="6" fill="#fde8c8" stroke="#333333" stroke-width="1.5"/>
  <text x="115" y="57" text-anchor="middle" font-size="16" font-weight="700" fill="#222222">DocumentViewer</text>
  <text x="115" y="79" text-anchor="middle" font-size="13" fill="#444444">(client)</text>
  <line x1="210" y1="63" x2="286" y2="63" stroke="#333333" stroke-width="1.5" marker-end="url(#solid)"/>
  <text x="248" y="54" text-anchor="middle" font-size="12" fill="#444444">uses</text>

  <!-- Subject -->
  <rect x="290" y="20" width="250" height="86" rx="6" fill="#d9ecd0" stroke="#333333" stroke-width="1.5"/>
  <text x="415" y="40" text-anchor="middle" font-size="12" font-style="italic" fill="#444444">«interface»</text>
  <text x="415" y="60" text-anchor="middle" font-size="16" font-weight="700" fill="#222222">DocumentStore</text>
  <line x1="290" y1="70" x2="540" y2="70" stroke="#333333" stroke-width="1"/>
  <text x="302" y="92" font-size="13" fill="#333333">+read(documentId): String</text>

  <!-- implements -->
  <path d="M200,172 L200,140 L390,140 L390,120" fill="none" stroke="#333333" stroke-width="1.5" stroke-dasharray="6,4"/>
  <polygon points="390,107 383,120 397,120" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <path d="M630,172 L630,140 L440,140 L440,120" fill="none" stroke="#333333" stroke-width="1.5" stroke-dasharray="6,4"/>
  <polygon points="440,107 433,120 447,120" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="415" y="158" text-anchor="middle" font-size="12" fill="#444444">implements</text>

  <!-- Proxy -->
  <rect x="60" y="172" width="280" height="86" rx="6" fill="#e3edfb" stroke="#333333" stroke-width="1.5"/>
  <text x="200" y="194" text-anchor="middle" font-size="12" font-style="italic" fill="#444444">proxy</text>
  <text x="200" y="214" text-anchor="middle" font-size="16" font-weight="700" fill="#222222">CachingDocumentStore</text>
  <line x1="60" y1="224" x2="340" y2="224" stroke="#333333" stroke-width="1"/>
  <text x="72" y="246" font-size="13" fill="#333333">-target: DocumentStore</text>

  <!-- Real subject -->
  <rect x="500" y="172" width="260" height="86" rx="6" fill="#d9ecd0" stroke="#333333" stroke-width="1.5"/>
  <text x="630" y="194" text-anchor="middle" font-size="12" font-style="italic" fill="#444444">real subject</text>
  <text x="630" y="214" text-anchor="middle" font-size="16" font-weight="700" fill="#222222">StorageDocumentStore</text>
  <line x1="500" y1="224" x2="760" y2="224" stroke="#333333" stroke-width="1"/>
  <text x="512" y="246" font-size="13" fill="#333333">does the real (slow) work</text>

  <!-- delegates -->
  <line x1="340" y1="215" x2="496" y2="215" stroke="#333333" stroke-width="1.5" marker-end="url(#solid)"/>
  <text x="418" y="206" text-anchor="middle" font-size="12" fill="#444444">delegates to</text>

  <!-- Call flow -->
  <rect x="20" y="290" width="760" height="112" rx="10" fill="#f6f6f6" stroke="#999999" stroke-width="1.2" stroke-dasharray="5,4"/>
  <text x="40" y="314" font-size="13" font-weight="700" fill="#333333">One call, step by step</text>

  <rect x="40" y="328" width="150" height="40" rx="5" fill="#fde8c8" stroke="#333333" stroke-width="1.2"/>
  <text x="115" y="353" text-anchor="middle" font-size="13" fill="#222222">client calls read()</text>
  <line x1="190" y1="348" x2="256" y2="348" stroke="#333333" stroke-width="1.5" marker-end="url(#solid)"/>

  <rect x="260" y="328" width="260" height="40" rx="5" fill="#e3edfb" stroke="#333333" stroke-width="1.2"/>
  <text x="390" y="353" text-anchor="middle" font-size="13" fill="#222222">proxy: in cache? return it. If not...</text>
  <line x1="520" y1="348" x2="586" y2="348" stroke="#333333" stroke-width="1.5" marker-end="url(#solid)"/>

  <rect x="590" y="328" width="170" height="40" rx="5" fill="#d9ecd0" stroke="#333333" stroke-width="1.2"/>
  <text x="675" y="353" text-anchor="middle" font-size="13" fill="#222222">real store loads it</text>

  <text x="400" y="390" text-anchor="middle" font-size="12" fill="#444444">The client can't tell whether it is talking to the proxy or to the real object: both are a DocumentStore</text>
</svg>
